name: Build and Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"

      - name: Install dependencies
        run: pnpm install

      - name: Run Biome
        run: pnpm biome ci

      - name: Run build
        run: pnpm build

      - name: Generate declaration files
        run: pnpm declarationfiles

      - name: Check editor tree-shaking
        run: pnpm check-treeshake

      # the sizes of the build, written to the summary of the job, checked against scripts/bundle-size-budget.json
      - name: Check the bundle size
        run: pnpm size

      - name: Check package exports and types
        run: pnpm check-package

      - name: Run tsc check
        run: pnpm tsc --project tsconfig.json

  test:
    runs-on: ubuntu-latest
    container:
      # Make sure to grab the latest version of the Playwright image
      # https://playwright.dev/docs/docker#pull-the-image
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"

      - name: Install dependencies
        run: pnpm install

      - name: Run unit tests
        run: pnpm test

      - name: Run UI tests
        run: pnpm test-storybook

  # The counts of the performance benchmark (renders, commits, draws of the canvas), checked against
  # tests/perf/counts-baseline.json: they do not depend on the speed of the runner, unlike the times
  perf-counts:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"

      - name: Install dependencies
        run: pnpm install

      - name: Check the counts of the benchmark
        run: pnpm bench:counts

      # the counts measured, in the format of the baseline, also when they fail
      - name: Upload the counts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          path: tests/perf/results/counts.json
          archive: false
          if-no-files-found: ignore
