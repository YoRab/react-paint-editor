name: Build and Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"

      - name: Install dependencies
        run: pnpm install

      - name: Run Biome
        run: pnpm biome ci

      - name: Run build
        run: pnpm build

      - name: Generate declaration files
        run: pnpm declarationfiles

      - name: Check editor tree-shaking
        run: pnpm check-treeshake

      - name: Check package exports and types
        run: pnpm check-package

      - name: Run tsc check
        run: pnpm tsc --project tsconfig.json

  test:
    runs-on: ubuntu-latest
    container:
      # Make sure to grab the latest version of the Playwright image
      # https://playwright.dev/docs/docker#pull-the-image
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"

      - name: Install dependencies
        run: pnpm install

      - name: Run unit tests
        run: pnpm test

      - name: Run UI tests
        run: pnpm test-storybook
